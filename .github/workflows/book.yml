name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pandoc and epubcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec java -jar %s/epubcheck-5.4.0/epubcheck.jar "$@"\n' "$PWD" > "$HOME/bin/epubcheck"
          chmod +x "$HOME/bin/epubcheck"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build and validate the EPUB
        run: uv run tools/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: jev-handbook
          path: dist/jev-handbook.epub
