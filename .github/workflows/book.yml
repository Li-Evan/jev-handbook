name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pandoc and epubcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec java -jar %s/epubcheck-5.4.0/epubcheck.jar "$@"\n' "$PWD" > "$HOME/bin/epubcheck"
          chmod +x "$HOME/bin/epubcheck"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build EPUB and web edition
        run: uv run tools/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
