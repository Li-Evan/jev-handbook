<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .wrap { display: grid; grid-template-columns: auto 1fr; gap: 14px 26px; }
  .waffle { display: grid; grid-template-columns: repeat(10, 36px); grid-auto-rows: 36px; gap: 5px; }
  .waffle i, .keys span::before { border-radius: 6px; background: var(--jev); }
  .re { background: var(--llm-soft) !important; box-shadow: inset 0 0 0 2px var(--llm); }
  .fix { background: var(--llm) !important; }
  .miss { background: var(--bad) !important; }
  .grp { border-left: 4px solid var(--jev); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .grp.g2 { border-color: var(--llm); }
  .head { display: flex; align-items: baseline; gap: 10px; font-weight: 600; white-space: nowrap; }
  .big { font: 700 40px/1 "JetBrains Mono", Menlo, monospace; }
  .grp .d { font-size: 22px; color: var(--muted); }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; font-size: 22px; }
  .keys span { display: flex; align-items: center; gap: 10px; }
  .keys span::before { content: ""; width: 22px; height: 22px; flex: none; border-radius: 5px; }
  .latin { font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif; }
  .sum { display: flex; align-items: baseline; gap: 14px; font-weight: 600; }
  .sum .num { font-size: 30px; }
</style></head><body>
<div class="wrap">
  <div class="waffle" id="w1"></div>
  <div class="grp"><div class="head"><span class="big accent">70</span>封直接采用</div><div class="d">置信度达到 0.95，全部判对</div></div>
  <div class="waffle" id="w2"></div>
  <div class="grp g2"><div class="head"><span class="big" style="color:var(--llm)">30</span>封升级给 Kimi K3</div><div class="d">Jev 的 10 个错误全在这里</div></div>
</div>
<div class="keys mt">
  <span>直接采用，判对</span>
  <span class="re-k">升级后仍判对</span>
  <span class="fix-k">Kimi 改对 2 封</span>
  <span class="miss-k">8 封诈骗，两个模型都判成正常</span>
</div>
<div class="rule mt"></div>
<div class="sum mt-s"><span>Jev 单独判对 <span class="num">90</span> 封</span><span class="muted">·</span><span>加上复核 <span class="num accent">92</span> 封</span></div>
<div class="tiny muted mt-s">每格一封邮件。数据：<span class="latin">jev-fraud</span> 仓库录制的一次运行，DIFrauD 数据集</div>
<style>
  .re-k::before { background: var(--llm-soft) !important; box-shadow: inset 0 0 0 2px var(--llm); }
  .fix-k::before { background: var(--llm) !important; }
  .miss-k::before { background: var(--bad) !important; }
</style>
<script>
  const fill = (id, cells) => { const w = document.getElementById(id);
    for (const c of cells) { const i = document.createElement("i"); if (c) i.className = c; w.appendChild(i); } };
  fill("w1", Array(70).fill(""));
  fill("w2", [...Array(20).fill("re"), ...Array(2).fill("fix"), ...Array(8).fill("miss")]);
</script>
</body></html>
