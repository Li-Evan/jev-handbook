<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .bars { grid-template-columns: 1fr 130px; gap: 8px 16px; }
  .bucket { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .bucket:first-of-type { margin-top: 0; }
  .bucket .b { font-size: 26px; }
  .bucket .meta { font-size: 22px; color: var(--muted); }
  .bucket .meta .num { color: var(--ink); }
  .bucket .meta .acc { color: var(--jev); }
</style></head><body>
<div class="small muted" style="margin-bottom:12px">柱长：1,000 条评论的总耗时</div>
<div class="bars">
  <div class="bucket"><span class="b">每请求 1 条</span><span class="meta">单次往返 <span class="num">476 毫秒</span>　准确率 <span class="num acc">94.8%</span></span></div>
  <div class="track"><i class="jev" style="width:100%"></i></div><span class="val">482.6 秒</span>
  <div class="bucket"><span class="b">每请求 10 条</span><span class="meta">单次往返 <span class="num">479 毫秒</span>　准确率 <span class="num acc">95.5%</span></span></div>
  <div class="track"><i class="jev" style="width:10.03%"></i></div><span class="val">48.4 秒</span>
  <div class="bucket"><span class="b">每请求 50 条</span><span class="meta">单次往返 <span class="num">535 毫秒</span>　准确率 <span class="num acc">95.4%</span></span></div>
  <div class="track"><i class="jev" style="width:2.26%"></i></div><span class="val">10.9 秒</span>
  <div class="bucket"><span class="b">每请求 100 条</span><span class="meta">单次往返 <span class="num">670 毫秒</span>　准确率 <span class="num acc">95.2%</span></span></div>
  <div class="track"><i class="jev" style="width:1.39%"></i></div><span class="val">6.7 秒</span>
</div>
<div class="tiny muted mt">数据：asahide 在 Qiita 上报告，好评差评各 500 条，每种跑 3 次取平均</div>
</body></html>
