<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .panel { background: var(--card); border: 2px solid var(--rule); border-radius: 16px; padding: 18px 22px 22px; }
  .panel + .panel { margin-top: 18px; }
  .ph { display: flex; align-items: baseline; gap: 12px; }
  .ph span { font-size: 22px; color: var(--muted); }
  .sub { font-size: 22px; font-weight: 600; margin: 16px 0 10px; }
  .bars { grid-template-columns: 190px 1fr 110px; gap: 12px 16px; }
  .bars .lab { font: 500 21px/1 "JetBrains Mono", Menlo, monospace; }
  .bars .lab.jev { color: var(--jev); font-weight: 700; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tile { border: 2px solid var(--gray); border-radius: 14px; padding: 12px 18px 14px; background: var(--card); }
  .tile.jev { border-color: var(--jev); background: var(--jev-soft); }
  .tile .who { font: 700 21px/1.2 "JetBrains Mono", Menlo, monospace; color: var(--muted); }
  .tile.jev .who { color: var(--jev); }
  .tile .big { margin-top: 8px; font-size: 24px; white-space: nowrap; }
  .tile .big .n { font: 700 40px/1.1 "JetBrains Mono", Menlo, monospace; color: var(--bad); }
  .tile .big .of { font: 700 26px/1 "JetBrains Mono", Menlo, monospace; color: var(--muted); }
  .tile .rate { font-size: 22px; margin-top: 6px; }
</style></head><body>
<div class="panel">
  <div class="ph"><div class="card-title">BoolQ</div><span>3,270 道阅读理解是非题</span></div>
  <div class="sub">整体准确率</div>
  <div class="bars">
    <span class="lab">openjev-sglang</span><div class="track"><i style="width:89.45%"></i></div><span class="val">89.45%</span>
    <span class="lab jev">Jev</span><div class="track"><i class="jev" style="width:91.56%"></i></div><span class="val accent">91.56%</span>
  </div>
  <div class="sub" style="margin-top:22px">给出 99% 以上概率的题里答错几道</div>
  <div class="tiles">
    <div class="tile"><div class="who">openjev-sglang</div><div class="big">错 <span class="n">32</span> <span class="of">/ 1,610</span></div><div class="rate">错误率约 <span class="num">2.0%</span></div></div>
    <div class="tile jev"><div class="who">Jev</div><div class="big">错 <span class="n">1</span> <span class="of">/ 366</span></div><div class="rate">错误率约 <span class="num">0.27%</span></div></div>
  </div>
</div>
<div class="panel">
  <div class="ph"><div class="card-title">MMLU-Pro</div><span>随机抽 1,000 道知识题，零样本作答</span></div>
  <div class="sub">整体准确率</div>
  <div class="bars">
    <span class="lab">openjev-sglang</span><div class="track"><i style="width:58.8%"></i></div><span class="val">58.8%</span>
    <span class="lab jev">Jev</span><div class="track"><i class="jev" style="width:82.9%"></i></div><span class="val accent">82.9%</span>
  </div>
</div>
<div class="tiny muted mt">数据：openjev-sglang 作者通过 OpenRouter 调用 Jev 做的逐题对比</div>
</body></html>
