<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .qs { display: flex; gap: 22px; margin-top: 8px; font-size: 22px; }
  .qs .num { color: var(--jev); }
  .w { display: flex; gap: 30px; margin-top: 10px; font-size: 22px; color: #d9d2c4; white-space: nowrap; }
  .w .num { margin-left: 8px; }
  .w .num { color: #fff; }
  .w .neg { color: #f4a49c; }
  .tiers { display: flex; align-items: stretch; margin-top: 4px; }
  .tiers > div { flex: 1; text-align: center; padding: 12px 0; font-size: 22px; font-weight: 600; border-radius: 10px; }
  .tiers .cut { flex: 0 0 58px; display: flex; align-items: center; justify-content: center; font: 700 22px/1 "JetBrains Mono", Menlo, monospace; color: var(--muted); }
  .t1 { background: var(--ink); color: #fff; }
  .t2 { background: var(--muted); color: #fff; }
  .t3 { background: var(--gray); }
  .t4 { background: #ebe5d7; color: var(--muted); }
  .rules { display: flex; flex-direction: column; gap: 14px; }
</style></head><body>
<div class="col">
  <div class="box jev"><div class="t">一封邮件，一次请求，21 个问题</div>
    <div class="qs"><span><span class="num">2</span> 个 Choice</span><span><span class="num">15</span> 个 Noul</span><span><span class="num">4</span> 个 Score</span></div></div>
  <div class="arrow down"></div>
  <div class="box code"><div class="t">代码按权重加出相关度</div>
    <div class="w"><span>对方同意<b class="num">+50</b></span><span>提出具体时间<b class="num">+45</b></span><span>问价格<b class="num">+35</b></span><span>退信<b class="num neg">−80</b></span></div></div>
  <div class="arrow down"></div>
  <div class="small muted">相关度分四档</div>
  <div class="tiers"><div class="t1">马上处理</div><b class="cut">70</b><div class="t2">今天处理</div><b class="cut">40</b><div class="t3">有空再看</div><b class="cut">15</b><div class="t4">忽略</div></div>
  <div class="small muted mt">另外两条规则</div>
  <div class="rules">
    <div class="box human"><div class="t">消息类型置信度低于 0.70</div><div class="d">只贴 needs-review，别的标签一个不贴</div></div>
    <div class="box bad"><div class="t">加进退订名单：撤不回来，默认关闭</div><div class="d">不看意图那道 Choice，单独看一个 Noul，到 0.80 才触发</div></div>
  </div>
</div>
<div class="tiny muted mt">数据：Warmbly 收件箱打标签文档和分拣策略代码</div>
</body></html>
