<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .qs { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 8px; font-size: 22px; }
  .qs .b { color: var(--ink); }
  .queues { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .queues .box { padding: 12px 14px; display: flex; flex-direction: column; }
  .queues .t { font-size: 24px; }
  .who { margin-top: auto; padding-top: 8px; border-top: 2px dashed var(--human); font-size: 20px; color: var(--human); font-weight: 600; }
  .forks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .forks .arrow { font-size: 30px; justify-self: center; }
  .queues .d { margin-bottom: 10px; }
</style></head><body>
<div class="col">
  <div class="box"><div class="t">一份材料进来</div><div class="d">state 里两个字段：筛选标准 protocol 和这份材料 record</div></div>
  <div class="arrow down"></div>
  <div class="box jev"><div class="t">Jev 一次回答</div>
    <div class="qs"><span class="b">Choice</span><span>总的结论：纳入还是排除，拿不准倾向纳入</span><span class="b">Noul</span><span>每条排除理由一个，不符合对应 true</span></div></div>
  <div class="arrow down"></div>
  <div class="box code"><div class="t">代码分三个队列，不做自动排除</div></div>
  <div class="forks"><div class="arrow down"></div><div class="arrow down"></div><div class="arrow down"></div></div>
  <div class="queues">
    <div class="box"><div class="t">先读</div><div class="d">判纳入，有把握<br>没有排除理由</div><div class="who">有人最先读</div></div>
    <div class="box"><div class="t">人工复核</div><div class="d">其余的都在这里</div><div class="who">有人逐份判断</div></div>
    <div class="box"><div class="t">大概率排除</div><div class="d">判排除，有把握<br>带着排除理由</div><div class="who">有人按理由成批核对</div></div>
  </div>
</div>
</body></html>
