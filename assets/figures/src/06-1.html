<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 44px 1fr; row-gap: 6px; }
  .cap { font-size: 22px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .screen { background: var(--card); border: 2px solid var(--rule); border-radius: 14px; overflow: hidden; }
  .bar { height: 30px; background: #ebe5d7; display: flex; gap: 8px; align-items: center; padding: 0 12px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--gray); }
  .page { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 20px; }
  .ctl { display: flex; align-items: center; gap: 10px; }
  .ctl .f { flex: 1; border: 2px solid var(--rule); border-radius: 8px; padding: 3px 10px; white-space: nowrap; }
  .ctl .f.btn { flex: none; border-radius: 20px; }
  .ctl .ph { color: var(--gray); }
  .n { font: 700 18px/1 "JetBrains Mono", Menlo, monospace; background: var(--ink); color: #f1ece1; border-radius: 6px; padding: 5px 6px; }
  .table { font: 500 20px/2.1 "JetBrains Mono", Menlo, monospace; white-space: nowrap; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; }
  .table .r { display: grid; grid-template-columns: 44px 112px auto; }
  .table .r.hit { color: #ffb08f; }
  .table .role { color: #8f8778; }
  .table .r.hit .role { color: #ffb08f; }
  .arrow.h { align-self: center; justify-self: center; }
  .ans { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-top: 8px; font-size: 24px; }
  .ans .num { color: var(--jev); }
  .note { margin-top: 18px; display: flex; align-items: center; gap: 14px; font-size: 22px; }
  .note .box { flex: 1; padding: 12px 16px; }
</style></head><body>
<div class="grid">
  <div class="cap">屏幕</div><div></div><div class="cap">代码读 DOM，印成候选表</div>
  <div class="screen">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="page">
      <div class="ctl"><span class="n">1</span><span class="f btn">Round trip ▾</span></div>
      <div class="ctl"><span class="n">2</span><span class="f">San Francisco</span></div>
      <div class="ctl"><span class="n">3</span><span class="f ph">Where to?</span></div>
      <div class="ctl"><span class="n">4</span><span class="f ph">Departure</span></div>
    </div>
  </div>
  <div class="arrow right h"></div>
  <div class="box code table">
    <div class="r hit"><span>[1]</span><span class="role">button</span><span>Round trip</span></div>
    <div class="r"><span>[2]</span><span class="role">combobox</span><span>Where from?</span></div>
    <div class="r"><span>[3]</span><span class="role">combobox</span><span>Where to?</span></div>
    <div class="r"><span>[4]</span><span class="role">textbox</span><span>Departure</span></div>
  </div>
  <div class="arrow center" style="justify-self:center">↑</div><div></div><div class="arrow down" style="justify-self:center"></div>
  <div class="box code" style="display:flex;flex-direction:column;justify-content:center"><div class="t">执行器点下 [1]</div><div class="d">点完重新读屏幕，进入下一步</div></div>
  <div class="arrow h">←</div>
  <div class="box jev"><div class="t">Jev 报编号</div>
    <div class="ans"><span>操作</span><span class="num">CLICK</span><span>目标</span><span class="num">[1]</span></div></div>
</div>
<div class="note"><span class="tag llm">LLM</span><div class="box llm">只有选中输入操作时，才叫小模型写字，比如写出 Zurich</div></div>
</body></html>
