<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
  .chain { display: grid; grid-template-columns: 300px 1fr; column-gap: 0; row-gap: 0; align-items: center; }
  .chain .box { padding: 12px 16px; font-size: 24px; }
  .link { display: flex; justify-content: center; position: relative; }
  .link::after { content: ""; position: absolute; left: calc(50% + 26px); right: 10px; top: 50%; border-top: 2px dashed var(--jev); }
  .link .arrow { margin: 4px 0; }
  .gate { display: flex; align-items: center; gap: 12px; }
  .gate .n { font: 700 20px/1 "JetBrains Mono", Menlo, monospace; color: #fff; background: var(--jev); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex: none; }
  .gate .w { font-size: 23px; font-weight: 600; }
  .gate .p { font-size: 20px; color: var(--muted); }
  .rulebar { margin-top: 26px; display: flex; gap: 12px; align-items: stretch; font-size: 22px; }
  .rulebar .box { padding: 12px 16px; }
</style></head><body>
<div class="chain">
  <div class="box human"><div class="t">用户消息</div></div><div></div>
  <div class="link"><div class="arrow down"></div></div>
  <div class="gate"><span class="n">1</span><div><div class="w">用户消息进来时</div><div class="p">官方护栏 cookbook</div></div></div>
  <div class="box llm"><div class="t">agent 决定调用工具</div></div><div></div>
  <div class="link"><div class="arrow down"></div></div>
  <div class="gate"><span class="n">2</span><div><div class="w">调用工具之前</div><div class="p">jev-shield</div></div></div>
  <div class="box"><div class="t">工具执行，返回结果</div></div><div></div>
  <div class="link"><div class="arrow down"></div></div>
  <div class="gate"><span class="n">3</span><div><div class="w">agent 读取工具结果之前</div><div class="p">jev-shield</div></div></div>
  <div class="box llm"><div class="t">agent 写回答</div></div><div></div>
  <div class="link"><div class="arrow down"></div></div>
  <div class="gate"><span class="n">4</span><div><div class="w">流式输出的过程中</div><div class="p">tokengate</div></div></div>
  <div class="box human"><div class="t">用户屏幕</div></div><div></div>
</div>
<div class="rulebar">
  <div class="box code grow"><div class="t">确定性规则在前</div><div class="d">不花钱，也不会被一段话说服</div></div>
  <div class="box jev grow"><div class="t">Jev 的概率只是一路信号</div><div class="d">沙箱和人工审批照样要留</div></div>
</div>
</body></html>
