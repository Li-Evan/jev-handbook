<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap");
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; height: 2560px; overflow: hidden; background: #121110; color: #f1ece1; position: relative; font-family: "PingFang SC", sans-serif; }
.inner { position: absolute; inset: 150px 140px; display: flex; flex-direction: column; }
.kicker { font: 600 42px/1 "JetBrains Mono", monospace; letter-spacing: .18em; color: #ff5a1f; }
h1 { font: 900 250px/1.02 "Songti SC", "STSong", serif; letter-spacing: -.02em; }
h1 .latin { font-family: "Georgia", serif; font-style: italic; font-weight: 400; }
.sub { font: 500 72px/1.3 "Songti SC", "STSong", serif; color: #d8d0c0; }
.mono { font-family: "JetBrains Mono", monospace; }
.author { display: flex; justify-content: space-between; align-items: baseline; font: 500 52px/1 "PingFang SC", sans-serif; color: #d8d0c0; }
.author .note { font: 500 34px/1 "PingFang SC", sans-serif; color: #7d766a; }
.gh { margin-top: 44px; font: 500 30px/1 "JetBrains Mono", monospace; color: #9d9585; display: flex; align-items: center; gap: 14px; }
.gh svg { width: 30px; height: 30px; }
.glow { position:absolute; right:-380px; top:-300px; width:1300px; height:1300px; border-radius:50%; background: radial-gradient(circle, rgba(255,90,31,.45), transparent 66%); }
h1 { margin-top: 60px; } .sub { margin-top: 44px; }
.cards { margin: auto 0; display: grid; gap: 40px; }
.card { border: 2px solid #2e2a25; border-radius: 28px; padding: 44px 48px; background: rgba(255,255,255,.02); }
.q { font: 500 38px/1 "JetBrains Mono", monospace; color: #9d9585; margin-bottom: 26px; }
.q b { color: #ff5a1f; font-weight: 600; }
.row { display: grid; grid-template-columns: 170px 1fr 110px; gap: 24px; align-items: center; font: 600 42px/1 "PingFang SC"; margin-top: 20px; }
.bar { height: 36px; background: #2a2723; border-radius: 6px; overflow: hidden; } .bar i { display:block; height:100%; background:#f1ece1; }
.win { color: #ff5a1f; } .win .bar i { background: #ff5a1f; } .p { text-align:right; font-family: "JetBrains Mono", monospace; }
.scale { position: relative; height: 30px; background: #2a2723; border-radius: 6px; margin: 30px 0 18px; }
.scale .dot { position:absolute; top:-12px; left: 50%; width: 54px; height: 54px; border-radius: 50%; background:#ff5a1f; transform: translateX(-50%); }
.ticks { display:flex; justify-content: space-between; font: 500 32px/1 "PingFang SC"; color: #d8d0c0; }
.noul { display:flex; align-items: center; justify-content: space-between; }
.noul .big { font: 700 96px/1 "JetBrains Mono", monospace; color: #ff5a1f; }
.author { }
</style>
</head>
<body><div class="glow"></div><div class="inner">
<div class="kicker">SYSTEM ONE · TYPED DECISIONS</div>
<h1><span class="latin">Jev</span><br>实战手册</h1>
<div class="sub">让 AI 只做判断题</div>
<div class="cards">
 <div class="card"><div class="q"><b>choice</b>("这张工单交给谁？")</div>
  <div class="row win"><span>技术</span><div class="bar"><i style="width:85%"></i></div><span class="p">0.85</span></div>
  <div class="row"><span>账单</span><div class="bar"><i style="width:12%"></i></div><span class="p">0.12</span></div>
  <div class="row"><span>销售</span><div class="bar"><i style="width:3%"></i></div><span class="p">0.03</span></div></div>
 <div class="card"><div class="q"><b>score</b>("客户有多着急？")</div>
  <div class="scale"><div class="dot"></div></div>
  <div class="ticks"><span>平静</span><span>着急</span><span>很生气</span></div></div>
 <div class="card noul"><div class="q" style="margin:0"><b>noul</b>("在要求退款")</div><span class="big">0.03</span></div>
</div>
<div class="author"><span>Evan 著</span><span class="note">社区真实用例精选</span></div>
